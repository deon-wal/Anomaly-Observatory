<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSIDIAN // EVOLUTION_v6.0</title>
    <style>
        :root {
            --accent: #00ffd5;
            --danger: #ff3e3e;
            --bg: #02060c;
            --glass: rgba(5, 11, 23, 0.9);
            --border: rgba(0, 255, 213, 0.3);
            --font: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; cursor: crosshair; }
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: var(--font);
            margin: 0; 
            overflow: hidden;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* CRT Effects */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        #viewport { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        canvas { display: block; filter: brightness(1.2) contrast(1.1); }

        .overlay { position: absolute; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }

        header {
            top: 0; left: 0; width: 100%;
            padding: 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .branding h1 { margin: 0; font-size: 1rem; color: var(--accent); letter-spacing: 6px; text-shadow: 0 0 10px var(--accent); }
        .status-bit { font-size: 0.6rem; color: var(--accent); opacity: 0.8; margin-top: 5px; }

        /* Right Panel: Data Stream */
        #archive-panel {
            top: 80px; right: 20px; bottom: 120px;
            width: 340px;
            background: var(--glass);
            border: 1px solid var(--border);
            display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .panel-header { padding: 15px; border-bottom: 1px solid var(--border); }
        .search-bar {
            width: 100%; background: #000; border: 1px solid var(--border);
            color: var(--accent); padding: 10px; font-family: inherit; font-size: 0.7rem; outline: none;
        }

        #feed { flex: 1; overflow-y: auto; padding: 10px; }
        #feed::-webkit-scrollbar { width: 4px; }
        #feed::-webkit-scrollbar-thumb { background: var(--accent); }

        .card {
            background: rgba(0, 255, 213, 0.03);
            border: 1px solid rgba(0, 255, 213, 0.1);
            padding: 12px; margin-bottom: 10px;
            transition: 0.3s; font-size: 0.75rem;
            position: relative;
        }
        .card:hover { 
            background: rgba(0, 255, 213, 0.15); 
            border-color: var(--accent); 
            transform: scale(1.02);
            cursor: pointer;
        }
        .card.threat { border-left: 4px solid var(--danger); background: rgba(255, 62, 62, 0.05); }
        .card h4 { margin: 0 0 5px; color: var(--accent); }
        .card .meta { display: flex; justify-content: space-between; opacity: 0.6; font-size: 0.6rem; }

        /* HUD elements */
        .controls { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; }
        .telemetry { position: absolute; bottom: 20px; right: 20px; width: 340px; height: 80px; background: var(--glass); border: 1px solid var(--border); font-size: 0.6rem; padding: 10px; color: var(--accent); overflow: hidden; }

        button {
            background: transparent; border: 1px solid var(--border); color: var(--accent);
            padding: 10px 20px; font-family: inherit; font-size: 0.6rem; 
        }
        button:hover { background: var(--accent); color: #000; }
        button.active { background: rgba(0, 255, 213, 0.2); box-shadow: inset 0 0 10px var(--accent); }

        #coords { position: absolute; bottom: 80px; left: 25px; font-size: 0.6rem; color: var(--accent); text-shadow: 0 0 5px var(--accent); }
    </style>
</head>
<body>

    <div id="viewport" class="overlay"><canvas id="map"></canvas></div>

    <header class="overlay">
        <div class="branding">
            <h1>OBSIDIAN // ANOMALY_DETECTOR</h1>
            <div id="status" class="status-bit">SEARCHING_FOR_UPLINK...</div>
        </div>
        <div class="interactive" style="text-align: right;">
            <div id="clock" style="font-size: 1.2rem; color: var(--accent);">00:00:00</div>
            <div style="font-size: 0.5rem; opacity: 0.5;">AZURE_SATELLITE_FEED</div>
        </div>
    </header>

    <div id="archive-panel" class="overlay interactive">
        <div class="panel-header">
            <input type="text" id="search" class="search-bar" placeholder="LOCATE_SECTOR...">
        </div>
        <div id="feed"></div>
    </div>

    <div id="coords" class="overlay">LAT: 0.00 | LON: 0.00</div>

    <div class="telemetry overlay">
        <div id="log-stream">SYSTEM INITIALIZED...<br>AWAITING DATA PACKETS...</div>
    </div>

    <div class="controls overlay interactive">
        <button id="tog-seismic" onclick="toggleFeed('seismic')" class="active">Seismic_Sensors</button>
        <button id="tog-space" onclick="toggleFeed('space')" class="active">Celestial_Scan</button>
    </div>

    <script>
        const canvas = document.getElementById("map");
        const ctx = canvas.getContext("2d");
        const feedContainer = document.getElementById('feed');
        const logStream = document.getElementById('log-stream');
        
        let events = [];
        let feeds = { seismic: true, space: true };
        let filterText = "";
        let camera = { x: 0, y: 0, targetX: 0, targetY: 0, zoom: 1 };

        // Generate a very rough world map path to make the background less boring
        const worldPath = new Path2D("M10,50 L20,40 L30,45 L40,30 L50,35 L60,20 L80,25 L90,10 L110,15 L120,40 L110,60 L90,70 L80,90 L60,85 L40,95 L20,80 Z");

        async function sync() {
            addLog("REQUESTING_EXTERNAL_DATA...");
            try {
                const qR = await fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson");
                const qJ = await qR.json();

                let incoming = qJ.features.map(f => ({
                    id: f.id, 
                    type: 'seismic', 
                    title: f.properties.place,
                    ts: f.properties.time, 
                    lat: f.geometry.coordinates[1], 
                    lon: f.geometry.coordinates[0],
                    val: f.properties.mag, 
                    score: (f.properties.mag / 8)
                }));

                const existing = new Set(events.map(e => e.id));
                const unique = incoming.filter(e => !existing.has(e.id));
                
                if(unique.length > 0) {
                    addLog(`INTERCEPTED_${unique.length}_NEW_SIGNALS`);
                    events = [...unique, ...events].slice(0, 40);
                    renderFeed();
                }
                document.getElementById('status').innerText = "CONNECTION_STABLE";
            } catch(e) { 
                document.getElementById('status').innerText = "UPLINK_CRITICAL_FAILURE"; 
            }
        }

        function renderFeed() {
            const filtered = events.filter(e => e.title.toLowerCase().includes(filterText.toLowerCase()));
            feedContainer.innerHTML = filtered.map(e => `
                <div class="card ${e.score > 0.5 ? 'threat' : ''}" onclick="focusEvent(${e.lat}, ${e.lon})">
                    <h4>${e.title}</h4>
                    <div class="meta">
                        <span>MAG: ${e.val}</span>
                        <span>${new Date(e.ts).toLocaleTimeString()}</span>
                    </div>
                </div>
            `).join('');
        }

        function focusEvent(lat, lon) {
            camera.targetX = (lon + 180) * (canvas.width / 360);
            camera.targetY = (90 - lat) * (canvas.height / 180);
            addLog(`FOCUSING_COORDS:_${lat.toFixed(2)}_${lon.toFixed(2)}`);
        }

        function addLog(msg) {
            const div = document.createElement('div');
            div.innerHTML = `> ${msg}`;
            logStream.prepend(div);
        }

        function draw() {
            // Smooth Camera follow
            camera.x += (camera.targetX - camera.x) * 0.05;
            camera.y += (camera.targetY - camera.y) * 0.05;

            ctx.fillStyle = "#02060c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = "rgba(0, 255, 213, 0.05)";
            for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            // Draw Events
            events.forEach(e => {
                const x = (e.lon + 180) * (canvas.width / 360);
                const y = (90 - e.lat) * (canvas.height / 180);
                const isSelected = Math.abs(camera.targetX - x) < 5 && Math.abs(camera.targetY - y) < 5;
                
                const pulse = Math.sin(Date.now()/200) * 10;
                const color = e.score > 0.5 ? '255, 62, 62' : '0, 255, 213';

                // Marker
                ctx.beginPath();
                ctx.arc(x, y, 4 + (e.score * 10), 0, Math.PI*2);
                ctx.fillStyle = `rgba(${color}, 0.8)`;
                ctx.fill();

                if(isSelected) {
                    ctx.strokeStyle = `rgba(${color}, 1)`;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x - 15 - pulse/2, y - 15 - pulse/2, 30 + pulse, 30 + pulse);
                }
            });

            requestAnimationFrame(draw);
        }

        function toggleFeed(f) {
            feeds[f] = !feeds[f];
            document.getElementById(`tog-${f}`).classList.toggle('active');
        }

        // Mouse coordinates
        window.addEventListener('mousemove', (e) => {
            const lon = (e.clientX / canvas.width * 360) - 180;
            const lat = 90 - (e.clientY / canvas.height * 180);
            document.getElementById('coords').innerText = `LAT: ${lat.toFixed(2)} | LON: ${lon.toFixed(2)}`;
        });

        window.addEventListener('resize', () => { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        });

        document.getElementById('search').addEventListener('input', (e) => {
            filterText = e.target.value;
            renderFeed();
        });

        // Initialize
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
        setInterval(sync, 30000);
        sync();
        draw();
    </script>
</body>
</html>
