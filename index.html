<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSIDIAN // ANOMALY_v5.0</title>
    <style>
        :root {
            --accent: #00ffd5;
            --danger: #ff3e3e;
            --bg: #03070f;
            --glass: rgba(5, 11, 23, 0.85);
            --border: rgba(0, 255, 213, 0.2);
        }

        * { box-sizing: border-box; cursor: crosshair; }
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Segoe UI', 'Courier New', monospace; 
            margin: 0; 
            overflow: hidden;
            letter-spacing: 1px;
        }

        /* Fullscreen Map */
        #viewport { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        canvas { display: block; filter: contrast(1.2) brightness(1.1); }

        /* Tactical Overlays */
        .overlay { position: absolute; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }

        header {
            top: 0; left: 0; width: 100%;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .branding h1 { margin: 0; font-size: 1.2rem; color: var(--accent); text-transform: uppercase; letter-spacing: 4px; }
        .status-bit { font-size: 0.7rem; color: var(--accent); opacity: 0.7; margin-top: 5px; }

        /* Right Panel: The Archive */
        #archive-panel {
            top: 80px; right: 20px; bottom: 20px;
            width: 380px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            display: flex; flex-direction: column;
        }

        .panel-header { padding: 15px; border-bottom: 1px solid var(--border); background: rgba(0, 255, 213, 0.05); }
        .search-bar {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
            color: var(--accent); padding: 8px; font-family: inherit; font-size: 0.8rem; outline: none;
        }

        #feed { flex: 1; overflow-y: auto; padding: 10px; scrollbar-width: thin; }
        
        /* Event Cards */
        .card {
            background: rgba(255,255,255,0.02);
            border-left: 2px solid var(--border);
            padding: 12px; margin-bottom: 8px;
            transition: 0.2s; font-size: 0.8rem;
        }
        .card:hover { background: rgba(0, 255, 213, 0.1); border-left-color: var(--accent); transform: translateX(-5px); }
        .card.threat { border-left-color: var(--danger); background: rgba(255, 62, 62, 0.05); }
        .card h4 { margin: 0 0 5px; font-size: 0.85rem; }
        .card .meta { display: flex; justify-content: space-between; opacity: 0.5; font-size: 0.65rem; }

        /* Controls Area */
        .controls { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; }
        button {
            background: var(--glass); border: 1px solid var(--border); color: var(--accent);
            padding: 8px 15px; font-family: inherit; font-size: 0.7rem; text-transform: uppercase;
        }
        button:hover { background: var(--accent); color: #000; }
        button.active { background: rgba(0, 255, 213, 0.2); }

        #coords { position: absolute; bottom: 60px; left: 20px; font-size: 0.7rem; color: var(--accent); opacity: 0.5; }

    </style>
</head>
<body>

    <div id="viewport" class="overlay"><canvas id="map"></canvas></div>

    <header class="overlay">
        <div class="identity">
            <h1>Obsidian Observatory</h1>
            <div id="status" class="status-bit">LINKING_TO_SATELLITE_ARRAY...</div>
        </div>
        <div class="interactive">
            <div id="clock" style="font-size: 1.2rem; font-weight: bold; text-align: right;">00:00:00</div>
            <div style="font-size: 0.6rem; opacity: 0.5; text-align: right;">GLOBAL_MONITOR_v5.0</div>
        </div>
    </header>

    <div id="archive-panel" class="overlay interactive">
        <div class="panel-header">
            <input type="text" id="search" class="search-bar" placeholder="FILTER_ARCHIVE_BY_LOCATION...">
        </div>
        <div id="feed"></div>
    </div>

    <div id="coords" class="overlay">LAT: 0.00 LON: 0.00</div>

    <div class="controls overlay interactive">
        <button id="tog-seismic" onclick="toggleFeed('seismic')" class="active">Seismic</button>
        <button id="tog-space" onclick="toggleFeed('space')" class="active">Space</button>
        <button onclick="purgeArchive()" style="border-color: var(--danger); color: var(--danger);">Purge</button>
    </div>

    <script>
        const canvas = document.getElementById("map");
        const ctx = canvas.getContext("2d");
        const searchInput = document.getElementById("search");
        let events = [];
        let feeds = { seismic: true, space: true };
        let filterText = "";

        // --- DATA ---
        function load() {
            const saved = localStorage.getItem('obs_v5');
            if (saved) events = JSON.parse(saved);
        }

        async function sync() {
            try {
                const [qR, sR] = await Promise.all([
                    fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson"),
                    fetch("https://services.swpc.noaa.gov/json/solar-cycle/observed-solar-cycle-indices.json")
                ]);
                const qJ = await qR.json();
                const sJ = await sR.json();

                let incoming = [];
                if(feeds.seismic) {
                    incoming.push(...qJ.features.map(f => ({
                        id: f.id, type: 'seismic', title: f.properties.place,
                        ts: f.properties.time, lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0],
                        val: f.properties.mag, score: (f.properties.mag / 8)
                    })));
                }
                if(feeds.space) {
                    const s = sJ[sJ.length-1];
                    incoming.push({
                        id: `sol-${s.ss}`, type: 'space', title: `Solar Activity: ${s.ss}`,
                        ts: Date.now(), lat: (Math.random()*120)-60, lon: (Math.random()*240)-120,
                        val: s.ss, score: 0.7
                    });
                }

                const existing = new Set(events.map(e => e.id));
                const unique = incoming.filter(e => !existing.has(e.id));
                events = [...unique, ...events].slice(0, 50);
                localStorage.setItem('obs_v5', JSON.stringify(events));
                render();
                document.getElementById('status').innerText = "SYSTEM_SYNC_COMPLETE";
            } catch(e) { document.getElementById('status').innerText = "UPLINK_ERROR"; }
        }

        function render() {
            const feed = document.getElementById('feed');
            const filtered = events.filter(e => e.title.toLowerCase().includes(filterText.toLowerCase()));
            
            feed.innerHTML = filtered.map(e => `
                <div class="card ${e.score > 0.6 ? 'threat' : ''}">
                    <h4>${e.title}</h4>
                    <div class="meta">
                        <span>${e.type.toUpperCase()} // LVL ${e.val || '??'}</span>
                        <span>${new Date(e.ts).toLocaleTimeString()}</span>
                    </div>
                </div>
            `).join('');
        }

        // --- VISUALS ---
        function draw() {
            ctx.fillStyle = "#03070f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle Grid
            ctx.strokeStyle = "rgba(0, 255, 213, 0.05)";
            ctx.lineWidth = 1;
            const step = 50;
            for(let x=0; x<canvas.width; x+=step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for(let y=0; y<canvas.height; y+=step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

            events.forEach(e => {
                const x = (e.lon + 180) * (canvas.width / 360);
                const y = (90 - e.lat) * (canvas.height / 180);
                const color = e.score > 0.6 ? '255, 62, 62' : '0, 255, 213';
                
                // Pulsing Ring
                const s = Math.sin(Date.now()/300) * 5;
                ctx.beginPath();
                ctx.arc(x, y, 10 + s + (e.score * 20), 0, Math.PI*2);
                ctx.strokeStyle = `rgba(${color}, 0.2)`;
                ctx.stroke();

                // Core
                ctx.fillStyle = `rgba(${color}, 0.8)`;
                ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
            });

            requestAnimationFrame(draw);
        }

        // --- INTERACTION ---
        function toggleFeed(f) {
            feeds[f] = !feeds[f];
            document.getElementById(`tog-${f}`).classList.toggle('active');
            sync();
        }

        function purgeArchive() { events = []; localStorage.removeItem('obs_v5'); render(); }

        searchInput.addEventListener('input', (e) => { filterText = e.target.value; render(); });

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // INIT
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        load();
        sync();
        draw();
        setInterval(sync, 60000);
    </script>
</body>
</html>
