<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSIDIAN // v8.0_KINETIC</title>
    <style>
        :root {
            --accent: #00ffd5;
            --warning: #ffb800;
            --danger: #ff3e3e;
            --bg: #030812;
            --glass: rgba(8, 15, 30, 0.98);
            --border: rgba(0, 255, 213, 0.25);
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-data: 'JetBrains Mono', 'Fira Code', monospace;
        }

        * { box-sizing: border-box; cursor: crosshair; }
        body { 
            background: var(--bg); color: #f0f4f8; 
            font-family: var(--font-ui); margin: 0; overflow: hidden; height: 100vh;
        }

        #viewport { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        canvas { display: block; }

        .overlay { position: absolute; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }

        /* UI Enhancements */
        header {
            top: 0; left: 0; width: 100%; padding: 30px;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(3,8,18,1), transparent);
        }
        .branding h1 { 
            margin: 0; font-size: 1.6rem; font-family: var(--font-data); 
            color: var(--accent); letter-spacing: 5px; font-weight: 800;
        }

        #archive-panel {
            top: 110px; right: 30px; bottom: 40px;
            width: 420px; background: var(--glass);
            border: 1px solid var(--border);
            display: flex; flex-direction: column;
            border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .panel-header { padding: 25px; border-bottom: 1px solid var(--border); }
        .search-bar {
            width: 100%; background: #000; border: 1px solid var(--border);
            color: var(--accent); padding: 15px; font-family: var(--font-data); 
            font-size: 1rem; outline: none; border-radius: 4px;
        }

        #feed { flex: 1; overflow-y: auto; padding: 20px; scrollbar-width: none; }

        /* Card Usability Update */
        .card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.07);
            padding: 20px; margin-bottom: 15px;
            transition: 0.3s cubic-bezier(0.19, 1, 0.22, 1);
            border-radius: 6px; position: relative;
        }
        .card:hover { 
            background: rgba(0, 255, 213, 0.1); 
            border-color: var(--accent);
            transform: scale(1.02);
        }
        .card.high-mag { border-left: 6px solid var(--danger); background: rgba(255,62,62,0.03); }
        .card h4 { margin: 0 0 10px; font-size: 1.1rem; color: #fff; line-height: 1.4; }
        .card .meta { 
            display: flex; justify-content: space-between; 
            font-family: var(--font-data); font-size: 0.85rem; color: var(--accent);
        }

        .controls { bottom: 30px; left: 30px; display: flex; gap: 15px; }
        button {
            background: var(--glass); border: 1px solid var(--border); color: var(--accent);
            padding: 15px 25px; font-family: var(--font-data); font-size: 0.9rem;
            text-transform: uppercase; border-radius: 4px; transition: 0.2s;
        }
        button:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }

        #coords { bottom: 100px; left: 35px; font-family: var(--font-data); font-size: 0.9rem; color: var(--accent); background: rgba(0,0,0,0.5); padding: 5px 10px; }
    </style>
</head>
<body>

    <div id="viewport" class="overlay"><canvas id="map"></canvas></div>

    <header class="overlay">
        <div class="branding">
            <h1>OBSIDIAN_KINETIC</h1>
            <div id="status" style="font-family: var(--font-data); font-size: 0.8rem; color: var(--accent);">LATENCY: 24ms // SENSORS: ONLINE</div>
        </div>
        <div class="interactive" style="text-align: right;">
            <div id="clock" style="font-size: 1.8rem; font-family: var(--font-data); color: var(--accent);">00:00:00</div>
        </div>
    </header>

    <div id="archive-panel" class="overlay interactive">
        <div class="panel-header">
            <input type="text" id="search" class="search-bar" placeholder="FILTER BY REGION...">
        </div>
        <div id="feed"></div>
    </div>

    <div id="coords" class="overlay">LAT: 00.00 // LON: 00.00</div>

    <div class="controls overlay interactive">
        <button onclick="resetCamera()">Reset View</button>
        <button onclick="sync()">Manual Sync</button>
    </div>

    <script>
        const canvas = document.getElementById("map");
        const ctx = canvas.getContext("2d");
        let events = [];
        let filterText = "";
        
        // CAMERA STATE
        let cam = { x: 0, y: 0, z: 1, tx: 0, ty: 0, tz: 1 };

        const continents = [
            [[-20,15],[-10,20],[10,25],[30,25],[45,10],[50,-20],[30,-35],[15,-30],[10,-10],[-10,-5]], 
            [[-100,50],[-60,50],[-60,20],[-80,10],[-100,20],[-120,30],[-120,50]],
            [[-80,10],[-40,10],[-40,-40],[-60,-55],[-80,-10]],
            [[0,50],[40,60],[140,60],[140,20],[80,10],[40,20]],
            [[110,-10],[150,-10],[150,-40],[110,-40]]
        ];

        async function sync() {
            try {
                const res = await fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson");
                const data = await res.json();
                events = data.features.map(f => ({
                    id: f.id, title: f.properties.place, mag: f.properties.mag,
                    time: f.properties.time, lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0]
                })).sort((a,b) => b.time - a.time);
                renderFeed();
            } catch(e) { console.error("Sync Failed"); }
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            const filtered = events.filter(e => e.title.toLowerCase().includes(filterText.toLowerCase()));
            feed.innerHTML = filtered.map(e => `
                <div class="card ${e.mag > 4.5 ? 'high-mag' : ''}" onclick="flyTo(${e.lat}, ${e.lon})">
                    <h4>${e.title}</h4>
                    <div class="meta">
                        <span>MAGNITUDE: ${e.mag.toFixed(1)}</span>
                        <span>${new Date(e.time).toLocaleTimeString()}</span>
                    </div>
                </div>
            `).join('');
        }

        function flyTo(lat, lon) {
            cam.tx = (lon + 180) * (canvas.width / 360);
            cam.ty = (90 - lat) * (canvas.height / 180);
            cam.tz = 4; // Zoom Level
        }

        function resetCamera() {
            cam.tx = canvas.width / 2;
            cam.ty = canvas.height / 2;
            cam.tz = 1;
        }

        function draw() {
            // Easing / Smoothing logic
            cam.x += (cam.tx - cam.x) * 0.08;
            cam.y += (cam.ty - cam.y) * 0.08;
            cam.z += (cam.tz - cam.z) * 0.08;

            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset
            ctx.fillStyle = "#030812";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Apply Camera Transform
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.scale(cam.z, cam.z);
            ctx.translate(-cam.x, -cam.y);

            // Grid
            ctx.strokeStyle = "rgba(0, 255, 213, 0.05)";
            for(let i=-2000; i<4000; i+=100) {
                ctx.beginPath(); ctx.moveTo(i,-2000); ctx.lineTo(i,4000); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-2000,i); ctx.lineTo(4000,i); ctx.stroke();
            }

            // Continents
            ctx.fillStyle = "rgba(0, 255, 213, 0.04)";
            ctx.strokeStyle = "rgba(0, 255, 213, 0.15)";
            continents.forEach(poly => {
                ctx.beginPath();
                poly.forEach((pt, i) => {
                    const x = (pt[0] + 180) * (canvas.width / 360);
                    const y = (90 - pt[1]) * (canvas.height / 180);
                    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                });
                ctx.closePath(); ctx.fill(); ctx.stroke();
            });

            // Nodes
            events.forEach(e => {
                const x = (e.lon + 180) * (canvas.width / 360);
                const y = (90 - e.lat) * (canvas.height / 180);
                const size = (2 + e.mag * 3) / (cam.z * 0.5); // Inverse scale so dots don't get huge
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI*2);
                ctx.fillStyle = e.mag > 4.5 ? `rgba(255, 62, 62, 0.8)` : `rgba(0, 255, 213, 0.8)`;
                ctx.fill();

                if(e.mag > 4.5) {
                    ctx.beginPath();
                    ctx.arc(x, y, size * (1.5 + Math.sin(Date.now()/200)), 0, Math.PI*2);
                    ctx.strokeStyle = "rgba(255, 62, 62, 0.3)";
                    ctx.stroke();
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
            resetCamera();
        });

        document.getElementById('search').addEventListener('input', (e) => { 
            filterText = e.target.value; 
            renderFeed(); 
        });

        // INIT
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        resetCamera();
        cam.x = cam.tx; cam.y = cam.ty; // Start at center
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
        setInterval(sync, 60000);
        sync(); draw();
    </script>
</body>
</html>
