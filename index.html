<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSIDIAN // v14.0_NEXUS</title>
    <style>
        :root {
            --cyan: #00e5ff;
            --cyan-dim: rgba(0, 229, 255, 0.15);
            --red: #ff2a2a;
            --bg: #030508;
            --panel: rgba(8, 12, 18, 0.85);
            --text: #e2e8f0;
            --font: 'SF Mono', 'Courier New', monospace;
        }

        * { box-sizing: border-box; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: var(--font); margin: 0; overflow: hidden; height: 100vh;
            user-select: none;
        }

        #viewport { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; cursor: grab; }
        #viewport:active { cursor: grabbing; }
        .overlay { position: absolute; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }

        header {
            top: 0; left: 0; width: 100%; padding: 20px 30px;
            display: flex; justify-content: space-between; align-items: flex-start;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            border-bottom: 1px solid var(--cyan-dim);
        }

        .title-block { font-weight: 700; color: var(--cyan); letter-spacing: 2px; font-size: 1.1rem; }
        .sub-block { font-size: 0.7rem; color: #8892b0; margin-top: 4px; letter-spacing: 1px; }

        #archive-panel {
            top: 90px; right: 20px; bottom: 30px; width: 340px;
            background: var(--panel); border: 1px solid var(--cyan-dim);
            display: flex; flex-direction: column; backdrop-filter: blur(10px);
            border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .panel-header {
            padding: 15px; border-bottom: 1px solid var(--cyan-dim);
            font-size: 0.8rem; color: var(--cyan); display: flex; justify-content: space-between;
        }

        #feed { flex: 1; overflow-y: auto; padding: 10px; }
        #feed::-webkit-scrollbar { width: 4px; }
        #feed::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 2px; }

        .card {
            background: rgba(255,255,255,0.02); border: 1px solid transparent;
            padding: 12px; margin-bottom: 8px; cursor: pointer; border-radius: 3px;
            transition: all 0.2s ease;
        }
        .card:hover { border-color: var(--cyan-dim); background: rgba(0, 229, 255, 0.05); }
        .card.active { border-left: 4px solid var(--cyan); background: var(--cyan-dim); }
        .card.danger { border-left-color: var(--red); }
        .card.danger.active { background: rgba(255, 42, 42, 0.1); border-color: var(--red); }

        .tooltip {
            position: absolute; background: rgba(0,0,0,0.9); border: 1px solid var(--cyan);
            padding: 10px; font-size: 0.75rem; color: var(--text); pointer-events: none;
            display: none; z-index: 100; border-radius: 3px; box-shadow: 0 0 15px var(--cyan-dim);
        }

        .hud-stats { bottom: 20px; left: 20px; font-size: 0.7rem; color: #8892b0; line-height: 1.6; }
    </style>
</head>
<body>

    <canvas id="viewport" class="interactive"></canvas>
    <div id="hover-tooltip" class="tooltip"></div>

    <header class="overlay">
        <div>
            <div class="title-block">NEXUS // GEODYNAMIC MONITOR</div>
            <div class="sub-block">OBSERVER_ZERO: BRIDGEWATER [ACTIVE]</div>
        </div>
        <div style="text-align: right;">
            <div id="clock" style="font-size: 1.2rem; color: var(--text);">00:00:00</div>
            <div class="sub-block">USGS_TELEMETRY_LINK: SECURE</div>
        </div>
    </header>

    <div id="archive-panel" class="overlay interactive">
        <div class="panel-header">
            <span>SEISMIC LOG (24H)</span>
            <span id="event-count" style="color: var(--text);">0 EVENTS</span>
        </div>
        <div id="feed"></div>
    </div>

    <div class="overlay hud-stats">
        SYSTEM: NOMINAL<br>
        PROJECTION: ORTHOGRAPHIC<br>
        ZOOM LVL: <span id="zoom-readout">25.0</span>x
    </div>

    <script>
        const canvas = document.getElementById("viewport");
        const ctx = canvas.getContext("2d");
        const tooltip = document.getElementById("hover-tooltip");

        let events = [];
        let hoveredEvent = null;
        let selectedId = null;
        
        // Camera & Interaction State
        let cam = { x: 138, y: -28, z: 22, tx: 138, ty: -28, tz: 22 };
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };
        let mousePos = { x: 0, y: 0 };

        const observerZero = { lat: -42.738, lon: 147.245 }; // Bridgewater
        const au_outline = [[113,-21],[114,-25],[113,-35],[115,-35],[120,-34],[125,-32],[130,-31],[135,-34],[138,-35],[140,-37],[145,-39],[150,-37],[153,-28],[150,-20],[145,-15],[142,-10],[135,-12],[130,-11],[125,-14],[120,-18],[113,-21]];
        const tas_outline = [[144.6,-40.7],[148.3,-40.8],[148.0,-43.6],[146.0,-43.6],[144.6,-40.7]];

        // --- Interaction Listeners ---
        canvas.addEventListener('mousedown', e => { isDragging = true; lastMouse = { x: e.clientX, y: e.clientY }; });
        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => { isDragging = false; tooltip.style.display = 'none'; });
        
        canvas.addEventListener('mousemove', e => {
            mousePos = { x: e.clientX, y: e.clientY };
            if (isDragging) {
                const dx = e.clientX - lastMouse.x;
                const dy = e.clientY - lastMouse.y;
                cam.tx -= dx / cam.z;
                cam.ty += dy / cam.z;
                lastMouse = { x: e.clientX, y: e.clientY };
            }
            checkHover();
        });

        canvas.addEventListener('wheel', e => {
            cam.tz *= (e.deltaY > 0 ? 0.9 : 1.1);
            cam.tz = Math.max(5, Math.min(cam.tz, 150)); // Clamp zoom
            document.getElementById('zoom-readout').innerText = cam.tz.toFixed(1);
        });

        canvas.addEventListener('click', () => {
            if (hoveredEvent && !isDragging) selectEvent(hoveredEvent.id);
            else if (!isDragging) { selectedId = null; renderFeed(); }
        });

        // --- Data Logic ---
        async function sync() {
            try {
                const res = await fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson");
                const data = await res.json();
                events = data.features
                    .filter(f => f.geometry.coordinates[0] > 105 && f.geometry.coordinates[0] < 160 && f.geometry.coordinates[1] > -50 && f.geometry.coordinates[1] < -5)
                    .map(f => ({
                        id: f.id, title: f.properties.place, mag: f.properties.mag,
                        depth: f.geometry.coordinates[2], time: f.properties.time,
                        lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0]
                    }));
                document.getElementById('event-count').innerText = `${events.length} EVENTS`;
                renderFeed();
            } catch(e) { console.error("API Error"); }
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = events.map(e => {
                const isDanger = e.mag >= 4.0;
                const isActive = selectedId === e.id;
                return `
                <div class="card ${isActive ? 'active' : ''} ${isDanger ? 'danger' : ''}" onclick="selectEvent('${e.id}')">
                    <div style="font-size:0.8rem; font-weight:bold; color: ${isDanger ? 'var(--red)' : 'var(--text)'}">${e.title}</div>
                    <div style="display:flex; justify-content:space-between; margin-top:6px; font-size:0.7rem; color:#8892b0;">
                        <span>M ${e.mag.toFixed(1)} | ${e.depth.toFixed(0)}km</span>
                        <span>${new Date(e.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                </div>`;
            }).join('');
        }

        function selectEvent(id) {
            selectedId = id;
            const e = events.find(x => x.id === id);
            cam.tx = e.lon; cam.ty = e.lat;
            renderFeed();
        }

        // Project lat/lon to screen coordinates to check mouse hover
        function checkHover() {
            hoveredEvent = null;
            let found = false;
            
            // Transform matrix logic matching the canvas context
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            events.forEach(e => {
                const screenX = centerX + (e.lon - cam.x) * cam.z;
                const screenY = centerY - (e.lat - cam.y) * cam.z; // - because Y is inverted
                const dist = Math.hypot(mousePos.x - screenX, mousePos.y - screenY);
                
                if (dist < 10) {
                    hoveredEvent = e;
                    found = true;
                    tooltip.style.display = 'block';
                    tooltip.style.left = (mousePos.x + 15) + 'px';
                    tooltip.style.top = (mousePos.y + 15) + 'px';
                    
                    const color = e.mag >= 4.0 ? 'var(--red)' : 'var(--cyan)';
                    tooltip.innerHTML = `
                        <strong style="color:${color}; font-size:0.85rem">${e.title}</strong><br>
                        <span style="color:#8892b0">MAG:</span> ${e.mag.toFixed(1)}<br>
                        <span style="color:#8892b0">DEPTH:</span> ${e.depth.toFixed(1)} km<br>
                        <span style="color:#8892b0">COORD:</span> ${e.lat.toFixed(2)}, ${e.lon.toFixed(2)}
                    `;
                }
            });

            if (!found) tooltip.style.display = 'none';
            canvas.style.cursor = found ? 'crosshair' : (isDragging ? 'grabbing' : 'grab');
        }

        function draw() {
            // Smooth Camera Interpolation
            cam.x += (cam.tx - cam.x) * 0.1;
            cam.y += (cam.ty - cam.y) * 0.1;
            cam.z += (cam.tz - cam.z) * 0.1;

            ctx.clearRect(0,0,canvas.width, canvas.height);

            // Draw Graticule (Lat/Lon Grid)
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.scale(cam.z, -cam.z);
            ctx.translate(-cam.x, -cam.y);

            ctx.strokeStyle = "rgba(0, 229, 255, 0.05)";
            ctx.lineWidth = 1 / cam.z;
            for(let i = 100; i <= 160; i += 5) { ctx.beginPath(); ctx.moveTo(i, -50); ctx.lineTo(i, 0); ctx.stroke(); }
            for(let i = -50; i <= 0; i += 5) { ctx.beginPath(); ctx.moveTo(100, i); ctx.lineTo(160, i); ctx.stroke(); }

            // Draw Landmasses
            ctx.strokeStyle = "rgba(0, 229, 255, 0.4)";
            ctx.fillStyle = "rgba(0, 229, 255, 0.02)";
            ctx.lineWidth = 1.5 / cam.z;
            [au_outline, tas_outline].forEach(shape => {
                ctx.beginPath();
                shape.forEach((p, i) => i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
                ctx.stroke(); ctx.fill();
            });

            // Draw Events
            events.forEach(e => {
                const isHovered = hoveredEvent && hoveredEvent.id === e.id;
                const isSelected = selectedId === e.id;
                const isDanger = e.mag >= 4.0;
                const color = isDanger ? "var(--red)" : "var(--cyan)";
                const radius = Math.max((e.mag) / (cam.z * 0.08), 2 / cam.z);

                ctx.fillStyle = color;
                ctx.strokeStyle = color;

                // Ping animation for selected or hovered
                if (isSelected || isHovered) {
                    const ping = (Math.sin(Date.now() / 150) + 1.5) * radius * 2;
                    ctx.lineWidth = 2 / cam.z;
                    ctx.beginPath(); ctx.arc(e.lon, e.lat, ping, 0, Math.PI * 2); ctx.stroke();
                }

                ctx.beginPath(); ctx.arc(e.lon, e.lat, radius, 0, Math.PI * 2); ctx.fill();
            });

            ctx.restore();
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
        sync(); draw();
    </script>
</body>
</html>
